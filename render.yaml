services:
  # Backend API Service
  - type: web
    name: inframind-backend
    env: node
    # --include=dev keeps the Prisma CLI available although NODE_ENV=production;
    # db:generate writes the Prisma client to server/generated/. Migrations are never run
    # here: the owner runs `npm run db:deploy` deliberately before deploying.
    buildCommand: cd server && npm ci --include=dev && npm run db:generate
    startCommand: cd server && npm start
    plan: free
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /health



  # Frontend Static Site
  - type: web
    name: inframind-frontend
    env: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: ./client/dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 18.0.0 